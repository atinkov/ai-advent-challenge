<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow — поддержка</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677084; --line:#e2e5eb; --accent:#2f6fed; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 12px; align-items: end; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .answer { white-space: pre-wrap; }
  .meta { font-size: 13px; color: var(--muted); }
  .sources li { font-size: 14px; }
  pre { background: #f2f4f7; padding: 12px; border-radius: 8px; overflow:auto; font-size: 12px; max-height: 320px; }
  .err { color: #b42318; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Ассистент поддержки TaskFlow</h1>
  <p class="sub">Ответ строится по данным тикета из CRM (MCP) и базе знаний: FAQ + документация (RAG).</p>

  <div class="card">
    <div class="row">
      <div><label for="ticket">Тикет</label><select id="ticket"><option value="">— без тикета —</option></select></div>
      <div><label for="q">Вопрос клиента</label><input id="q" value="Почему не работает авторизация?"></div>
      <button id="ask">Спросить</button>
    </div>
  </div>

  <div class="card" id="result" hidden>
    <div class="meta" id="meta"></div>
    <div class="answer" id="answer"></div>
    <p class="meta"><b>Источники (RAG):</b></p>
    <ol class="sources" id="sources"></ol>
    <details><summary class="meta">Данные тикета из CRM (MCP get_ticket)</summary><pre id="crm"></pre></details>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
fetch('/api/tickets').then(r => r.json()).then(d => {
  for (const t of d.tickets) {
    const o = document.createElement('option');
    o.value = t.id; o.textContent = `${t.id} · ${t.user} · ${t.subject} (${t.status})`;
    $('ticket').appendChild(o);
  }
  $('ticket').value = 'T-1001';
});
$('ask').onclick = async () => {
  $('ask').disabled = true; $('ask').textContent = 'Думаю…';
  try {
    const r = await (await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticketId: $('ticket').value, question: $('q').value})})).json();
    $('result').hidden = false;
    $('meta').textContent = `${$('ticket').value || 'без тикета'} · ${(r.millis/1000).toFixed(1)} с`;
    $('answer').textContent = r.error ? '' : r.answer;
    if (r.error) $('answer').innerHTML = `<span class="err"></span>`, $('answer').firstChild.textContent = r.error;
    $('sources').innerHTML = '';
    r.sources.forEach(s => { const li = document.createElement('li'); li.textContent = s; $('sources').appendChild(li); });
    $('crm').textContent = r.ticket || '—';
  } finally { $('ask').disabled = false; $('ask').textContent = 'Спросить'; }
};
</script>
</body>
</html>
